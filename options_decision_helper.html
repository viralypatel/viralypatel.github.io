<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Options Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f9f9f9;
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .section {
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .section h2 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .field {
            margin-bottom: 10px;
            text-align: center;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .row .field {
            margin-bottom: 0;
        }
        .calc-table tr:nth-child(even) {
            background: #f2f2f2;
        }
        .calc-table .base {
            font-weight: bold;
            background: #ddd;
        }
        .group-header {
            cursor: pointer;
            background: #e0e0e0;
            text-align: center;
            font-style: italic;
        }
        input[type="number"] {
            width: 120px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        hr {
            border: none;
            border-top: 1px solid #eee;
            width: 100%;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Options Decision Helper</h1>
        <div class="section">
            <div class="row">
            <div class="field">
                <label for="price">Underlying ($):</label><br>
                <input type="number" id="price" step="0.01" value="0">
            </div>
            <div class="field">
                <label for="roiPct">ROI:</label><br>
                <input type="number" id="roiPct" step="0.01" value="2"> %
            </div>
        </div>
            <div class="field">
                <table class="calc-table" style="width:100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="text-align:left; padding:4px 8px; border-bottom:1px solid #ddd;">Level (%)</th>
                            <th style="text-align:right; padding:4px 8px; border-bottom:1px solid #ddd;">Price</th>
                            <th style="text-align:right; padding:4px 8px; border-bottom:1px solid #ddd;">Cost of 100</th>
                            <th style="text-align:right; padding:4px 8px; border-bottom:1px solid #ddd;">Expected return</th>
                            <th style="text-align:right; padding:4px 8px; border-bottom:1px solid #ddd;">Option &#36; Price</th>
                            <th style="text-align:right; padding:4px 8px; border-bottom:1px solid #ddd;">Option Total</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody">
                        <!-- rows will be generated by script -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const priceInput = document.getElementById('price');
        const roiInput = document.getElementById('roiPct');
        const tbody = document.getElementById('dataBody');
        const fmt = v => '$' + v.toFixed(2);

        function update() {
          const price = parseFloat(priceInput.value) || 0;
          const roi = parseFloat(roiInput.value) || 0;
          tbody.innerHTML = '';
          // header below first
          const hdrBelow = document.createElement('tr');
          hdrBelow.className = 'group-header';
          hdrBelow.dataset.group = 'below';
          hdrBelow.innerHTML = '<td colspan="6">Below base (click to toggle)</td>';
          tbody.appendChild(hdrBelow);
          // rows below: -50% to -5% (reverse order)
          for (let lvl = -50; lvl <= -5; lvl += 5) {
            const row = makeRow(lvl, price, roi);
            row.classList.add('below');
            tbody.appendChild(row);
          }
          // base row
          const baseRow = makeRow(0, price, roi);
          baseRow.classList.add('base');
          tbody.appendChild(baseRow);
          // header above afterwards
          const hdrAbove = document.createElement('tr');
          hdrAbove.className = 'group-header';
          hdrAbove.dataset.group = 'above';
          hdrAbove.innerHTML = '<td colspan="6">Above base (click to toggle)</td>';
          tbody.appendChild(hdrAbove);
          // rows above: 5% to 50%
          for (let lvl = 5; lvl <= 50; lvl += 5) {
            const row = makeRow(lvl, price, roi);
            row.classList.add('above');
            tbody.appendChild(row);
          }
          attachGroupHandlers();
        }

        function makeRow(lvl, price, roi) {
          const rowPrice = price * (1 + lvl/100);
          const cost = rowPrice * 100;
          const ret = cost * roi / 100;
          const optPrice = ret / 100;
          const optTotal = ret;
          const tr = document.createElement('tr');
          tr.innerHTML = `
      <td style="padding:4px 8px;">${lvl}%</td>
      <td style="padding:4px 8px; text-align:right;">${fmt(rowPrice)}</td>
      <td style="padding:4px 8px; text-align:right;">${fmt(cost)}</td>
      <td style="padding:4px 8px; text-align:right;">${fmt(ret)}</td>
      <td style="padding:4px 8px; text-align:right;">${fmt(optPrice)}</td>
      <td style="padding:4px 8px; text-align:right;">${fmt(optTotal)}</td>
    `;
          return tr;
        }

        function attachGroupHandlers() {
          document.querySelectorAll('.group-header').forEach(hdr => {
            hdr.onclick = () => {
              const grp = hdr.dataset.group;
              document.querySelectorAll('tr.' + grp).forEach(r => {
                r.style.display = (r.style.display === 'none' ? '' : 'none');
              });
            };
          });
        }

        priceInput.addEventListener('input', update);
        roiInput.addEventListener('input', update);
        update();
      });
    </script>
</body>
</html>
